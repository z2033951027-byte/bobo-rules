name: Build Bobo Rules

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-rules.yml"
      - "scripts/build_rules.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bobo-rules-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify the single proxy rule set
        run: python3 scripts/build_rules.py

      - name: Commit verified artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bobo-final-proxy.json bobo-final-proxy.srs verification.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build verified single-entry mobile rules"
            git push
          fi